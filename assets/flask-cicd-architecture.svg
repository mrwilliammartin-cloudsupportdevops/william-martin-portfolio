  <text x="145" y="248" fill="#a8b3c7" font-size="14">Source code</text>
  <text x="145" y="270" fill="#a8b3c7" font-size="14">Version control</text>

  <rect x="285" y="180" width="180" height="105" rx="18" fill="#121a2d" stroke="#a78bfa" stroke-width="2"/>
  <text x="375" y="220" fill="#a78bfa" font-size="19" font-weight="700">Azure DevOps</text>
  <text x="375" y="248" fill="#a8b3c7" font-size="14">Build / test</text>
  <text x="375" y="270" fill="#a8b3c7" font-size="14">CI/CD workflow</text>

  <rect x="515" y="180" width="180" height="105" rx="18" fill="#121a2d" stroke="#6ee7ff" stroke-width="2"/>
  <text x="605" y="220" fill="#6ee7ff" font-size="19" font-weight="700">Docker</text>
  <text x="605" y="248" fill="#a8b3c7" font-size="14">Build image</text>
  <text x="605" y="270" fill="#a8b3c7" font-size="14">Package Flask app</text>

  <rect x="745" y="180" width="180" height="105" rx="18" fill="#121a2d" stroke="#a78bfa" stroke-width="2"/>
  <text x="835" y="220" fill="#a78bfa" font-size="19" font-weight="700">Docker Hub</text>
  <text x="835" y="248" fill="#a8b3c7" font-size="14">Image registry</text>
  <text x="835" y="270" fill="#a8b3c7" font-size="14">Versioned image</text>

  <rect x="975" y="150" width="170" height="165" rx="18" fill="#121a2d" stroke="#6ee7ff" stroke-width="2"/>
  <text x="1060" y="190" fill="#6ee7ff" font-size="19" font-weight="700">Kubernetes</text>
