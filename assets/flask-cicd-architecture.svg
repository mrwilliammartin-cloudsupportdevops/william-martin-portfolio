<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
<rect width="1200" height="560" rx="28" fill="#0b1020"/>
<text x="600" y="52" text-anchor="middle" fill="#edf2f7" font-family="Arial" font-size="28" font-weight="700">Flask CI/CD → Docker → Kubernetes</text>
<text x="600" y="82" text-anchor="middle" fill="#a8b3c7" font-family="Arial" font-size="15">Hands-on deployment workflow</text>
<g font-family="Arial" text-anchor="middle">
  <rect x="55" y="180" width="180" height="105" rx="18" fill="#121a2d" stroke="#6ee7ff" stroke-width="2"/>
